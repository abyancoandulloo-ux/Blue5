<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue5 Academy | Photos</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #f0f4fa; color: #1f2a44; }
        
        /* Navbar */
        .top-nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; background: white; box-shadow: 0 2px 12px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 100; }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-icon { font-size: 28px; color: #0a4da4; }
        .logo-text { font-size: 1.3rem; font-weight: 700; color: #0a4da4; }
        .logo-text .accent { font-weight: 800; color: #1e6fdf; }
        .logo-link { text-decoration: none; }
        .main-nav ul { display: flex; gap: 28px; list-style: none; }
        .main-nav a { text-decoration: none; color: #1f2a44; font-weight: 500; transition: color 0.2s; }
        .main-nav a:hover { color: #0a4da4; }
        .main-nav a.active-nav { color: #0a4da4; font-weight: 600; }
        
        /* Main Content */
        .container { max-width: 1300px; margin: 40px auto; padding: 0 20px; min-height: 70vh; }
        .header-wrapper { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        .section-title { color: #0a4da4; font-size: 2rem; }
        .title-underline { width: 80px; height: 3px; background: #0a4da4; margin-top: 5px; border-radius: 3px; }

        /* Action Buttons */
        .admin-action-btn { background: #1e6fdf; color: white; border: none; padding: 10px 24px; border-radius: 30px; font-family: 'Poppins', sans-serif; font-weight: 600; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; gap: 8px; }
        .admin-action-btn:hover { background: #0a4da4; }

        /* Upload Panel Box */
        .upload-card { background: white; border-radius: 20px; padding: 25px; margin-bottom: 35px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); display: none; }
        .upload-card h3 { color: #0a4da4; margin-bottom: 15px; font-size: 1.2rem; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; align-items: end; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 0.85rem; font-weight: 600; color: #5a6e8a; }
        .form-group input, .form-group select { padding: 10px 14px; border-radius: 10px; border: 1px solid #cbd5e1; font-family: 'Poppins', sans-serif; font-size: 0.9rem; }
        .upload-submit-btn { background: #0a4da4; color: white; border: none; padding: 11px 25px; border-radius: 10px; font-family: 'Poppins', sans-serif; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
        .upload-submit-btn:hover { opacity: 0.9; }

        /* Age Group Filters */
        .gallery-filters { display: flex; justify-content: center; gap: 20px; margin-bottom: 40px; margin-top: 20px; }
        .filter-btn { background: white; color: #0a4da4; border: 2px solid #0a4da4; padding: 10px 28px; border-radius: 40px; font-family: 'Poppins', sans-serif; font-weight: 600; cursor: pointer; transition: all 0.3s ease; }
        .filter-btn:hover { background: #e0eafd; }
        .filter-btn.active { background: #0a4da4; color: white; box-shadow: 0 6px 15px rgba(10, 77, 164, 0.25); }

        /* Gallery Grid Layout */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; }
        .gallery-item { background: white; border-radius: 24px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.06); transition: transform 0.3s ease, box-shadow 0.3s ease; cursor: pointer; }
        .gallery-item:hover { transform: translateY(-6px); box-shadow: 0 15px 35px rgba(10, 77, 164, 0.15); }
        
        .img-container { width: 100%; height: 250px; overflow: hidden; background: #e2e8f0; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .gallery-item:hover .img-container img { transform: scale(1.05); }

        .img-details { padding: 20px; border-top: 1px solid #f0f4fa; }
        .img-details h4 { font-size: 1.05rem; color: #1f2a44; margin-bottom: 5px; font-weight: 600; }
        .img-details p { font-size: 0.85rem; color: #64748b; display: flex; align-items: center; gap: 6px; }

        /* Lightbox Modal */
        .lightbox { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(12, 27, 51, 0.95); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 10000; padding: 20px; }
        .lightbox-content { max-width: 90%; max-height: 80vh; border-radius: 16px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); object-fit: contain; transform: scale(0.95); transition: transform 0.3s ease; }
        .lightbox.open .lightbox-content { transform: scale(1); }
        .lightbox-close { position: absolute; top: 25px; right: 35px; color: white; font-size: 40px; cursor: pointer; }
        .lightbox-caption { position: absolute; bottom: 30px; color: white; font-size: 1.1rem; background: rgba(0,0,0,0.7); padding: 10px 25px; border-radius: 40px; }

        /* Status States */
        .status-msg { text-align: center; padding: 40px; color: #5a6e8a; font-size: 1.1rem; width: 100%; grid-column: 1 / -1; }

        /* Footer */
        .footer { background: #0c1b33; color: white; text-align: center; padding: 20px; margin-top: 60px; }
    </style>
</head>
<body>

    <div class="top-nav">
        <a href="index.html" class="logo-link">
            <div class="logo-area">
                <i class="fas fa-futbol logo-icon"></i>
                <span class="logo-text">Blue5<span class="accent">Football</span> Academy</span>
            </div>
        </a>
        <nav class="main-nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html">Log in</a></li>
                <li><a href="Payment.html">Payment</a></li>
                <li><a href="sessions.html">Sessions</a></li>
                <li><a href="photos.html" class="active-nav">Photos</a></li>
                <li><a href="Coach.html">Coach</a></li>
            </ul>
        </nav>
    </div>

    <div class="container">
        <div class="header-wrapper">
            <div>
                <h2 class="section-title"><i class="fas fa-camera"></i> Training Moments Gallery</h2>
                <div class="title-underline"></div>
            </div>
            <button class="admin-action-btn" id="openUploadBoxBtn"><i class="fas fa-cloud-upload-alt"></i> Upload Photo</button>
        </div>

        <div class="upload-card" id="uploadCard">
            <h3><i class="fas fa-plus-circle"></i> Add New Training Image Asset</h3>
            <form id="photoUploadForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="photoFile">Choose Image File</label>
                        <input type="file" id="photoFile" accept="image/*" required>
                    </div>
                    <div class="form-group">
                        <label for="photoDesc">Image Description / Title</label>
                        <input type="text" id="photoDesc" placeholder="e.g. Cone Dribbling Drills" required>
                    </div>
                    <div class="form-group">
                        <label for="photoAgeGroup">Target Age Cohort Group</label>
                        <select id="photoAgeGroup" required>
                            <option value="6-8">6-8 Years Old</option>
                            <option value="9-11">9-11 Years Old</option>
                        </select>
                    </div>
                    <button type="submit" class="upload-submit-btn" id="uploadSubmitBtn">Publish to Portal</button>
                </div>
            </form>
        </div>

        <div class="gallery-filters">
            <button class="filter-btn active" data-filter="all">All Groups</button>
            <button class="filter-btn" data-filter="6-8">6-8 Years Old</button>
            <button class="filter-btn" data-filter="9-11">9-11 Years Old</button>
        </div>

        <div class="gallery-grid" id="galleryGrid">
            <div class="status-msg" id="gridStatus"><i class="fas fa-spinner fa-spin"></i> Connecting to gallery database...</div>
        </div>
    </div>

    <div id="lightboxModal" class="lightbox" onclick="closeLightbox()">
        <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
        <img class="lightbox-content" id="lightboxImg" alt="Enlarged View">
        <div class="lightbox-caption" id="lightboxCaption"></div>
    </div>

    <footer class="footer">
        <div class="copyright">© 2026 Blue5 Football Academy — Media Portal</div>
    </footer>

    <script type="module">
        let supabase = null;
        try {
            const module = await import('./supabase-config.js');
            supabase = module.supabase;
            
            if (!supabase || !supabase.storage) {
                throw new Error("Supabase client initialized, but storage configuration is unreachable.");
            }
        } catch (err) {
            console.error("Configuration cloud interface connection block:", err);
            document.getElementById('gridStatus').innerHTML = `
                <span style="color:#e53e3e; font-weight:600;">
                    <i class="fas fa-exclamation-triangle"></i> Database Connection Error. Ensure files are running via a web server environment.
                </span>`;
        }

        const CORRECT_PASSWORD = "Saliim007";
        let currentFilter = "all";
        let localPhotosCache = [];

        // UI Target Bindings
        const openUploadBoxBtn = document.getElementById('openUploadBoxBtn');
        const uploadCard = document.getElementById('uploadCard');
        const photoUploadForm = document.getElementById('photoUploadForm');
        const galleryGrid = document.getElementById('galleryGrid');
        const gridStatus = document.getElementById('gridStatus');

        // Verify Admin Credentials
        openUploadBoxBtn.addEventListener('click', () => {
            if (uploadCard.style.display === 'block') {
                uploadCard.style.display = 'none';
                return;
            }
            const accessKey = prompt("Coach Access Verification Required:\nEnter Security Password:");
            if (accessKey === null) return;
            
            if (accessKey === CORRECT_PASSWORD) {
                uploadCard.style.display = 'block';
                uploadCard.scrollIntoView({ behavior: 'smooth' });
            } else {
                alert("Access Denied: Incorrect portal security key token match.");
            }
        });

        // Pull Images and Render
        async function fetchGalleryRecords() {
            if (!supabase) return;
            try {
                const { data, error } = await supabase
                    .from('gallery_photos')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                localPhotosCache = data || [];
                renderActiveView();
            } catch (err) {
                console.error("Database records compilation error:", err);
                gridStatus.innerHTML = `<span style="color:#e53e3e;"><i class="fas fa-wifi"></i> Sync error reading gallery entries.</span>`;
            }
        }

        function renderActiveView() {
            const filtered = localPhotosCache.filter(p => currentFilter === 'all' || p.age_group === currentFilter);
            
            if (filtered.length === 0) {
                galleryGrid.innerHTML = `<div class="status-msg"><i class="far fa-images"></i> No photos found in this category.</div>`;
                return;
            }

            galleryGrid.innerHTML = '';
            filtered.forEach(photo => {
                const iconClass = photo.age_group === '6-8' ? 'fa-child' : 'fa-user-friends';
                const card = document.createElement('div');
                card.className = 'gallery-item';
                card.innerHTML = `
                    <div class="img-container">
                        <img src="${photo.image_url}" alt="Session Image">
                    </div>
                    <div class="img-details">
                        <h4>${escapeHtml(photo.description)}</h4>
                        <p><i class="fas ${iconClass}"></i> Age Group: ${photo.age_group} Years</p>
                    </div>
                `;
                card.addEventListener('click', () => openLightbox(photo.image_url, photo.description));
                galleryGrid.appendChild(card);
            });
        }

        // Processing Storage Upload Pipelines
        photoUploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!supabase) {
                alert("Upload Blocked: Database initialization incomplete.");
                return;
            }

            const fileInput = document.getElementById('photoFile');
            const descInput = document.getElementById('photoDesc');
            const ageGroupInput = document.getElementById('photoAgeGroup');
            const submitBtn = document.getElementById('uploadSubmitBtn');

            if (!fileInput.files || fileInput.files.length === 0) {
                alert("Please select an image file first.");
                return;
            }

            const activeFile = fileInput.files[0];
            const fileExt = activeFile.name.split('.').pop();
            const cleanFileName = `${Date.now()}-${Math.random().toString(36).substring(2, 7)}.${fileExt}`;
            const pathLocation = `uploads/${cleanFileName}`;

            submitBtn.disabled = true;
            submitBtn.textContent = "Uploading image...";

            try {
                // 1. Send binary file to Supabase storage bucket
                const { error: storageError } = await supabase.storage
                    .from('academy-photos')
                    .upload(pathLocation, activeFile);

                if (storageError) throw storageError;

                // 2. Resolve public URL endpoint
                const { data: urlData } = supabase.storage
                    .from('academy-photos')
                    .getPublicUrl(pathLocation);

                const publicAssetUrl = urlData.publicUrl;

                // 3. Insert data into database table explicitly structuring it to ignore immediate select triggers
                const { error: tableError } = await supabase
                    .from('gallery_photos')
                    .insert([
                        {
                            storage_path: pathLocation,
                            image_url: publicAssetUrl,
                            description: descInput.value.trim(),
                            age_group: ageGroupInput.value
                        }
                    ], { returning: 'minimal' });

                if (tableError) throw tableError;

                alert("Success: Image published to portal!");
                
                photoUploadForm.reset();
                uploadCard.style.display = 'none';
                
                await fetchGalleryRecords();

            } catch (err) {
                console.error("Fatal transaction execution error:", err);
                alert(`Upload workflow failed: ${err.message}`);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Publish to Portal";
            }
        });

        // Filter Controls Setup
        document.querySelectorAll('.filter-btn').forEach(button => {
            button.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                currentFilter = e.target.getAttribute('data-filter');
                renderActiveView();
            });
        });

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Initialize App View
        if (supabase) {
            fetchGalleryRecords();
        }
    </script>

    <script>
        const lightbox = document.getElementById('lightboxModal');
        const lightboxImg = document.getElementById('lightboxImg');
        const lightboxCap = document.getElementById('lightboxCaption');

        function openLightbox(imgSrc, captionText) {
            lightboxImg.src = imgSrc;
            lightboxCap.textContent = captionText;
            lightbox.style.display = 'flex';
            setTimeout(() => lightbox.classList.add('open'), 10);
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('open');
            setTimeout(() => lightbox.style.display = 'none', 300);
            document.body.style.overflow = '';
        }
    </script>
</body>
</html>
