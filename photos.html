<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue5 Academy | Photos</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #f0f4fa; color: #1f2a44; }
        
        /* Navbar */
        .top-nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; background: white; box-shadow: 0 2px 12px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 100; }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-icon { font-size: 28px; color: #0a4da4; }
        .logo-text { font-size: 1.3rem; font-weight: 700; color: #0a4da4; }
        .logo-text .accent { font-weight: 800; color: #1e6fdf; }
        .logo-link { text-decoration: none; }
        .main-nav ul { display: flex; gap: 28px; list-style: none; }
        .main-nav a { text-decoration: none; color: #1f2a44; font-weight: 500; transition: color 0.2s; }
        .main-nav a:hover { color: #0a4da4; }
        .main-nav a.active-nav { color: #0a4da4; font-weight: 600; }
        
        /* Main Content */
        .container { max-width: 1300px; margin: 40px auto; padding: 0 20px; min-height: 70vh; }
        .header-wrapper { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        .section-title { color: #0a4da4; font-size: 2rem; }
        .title-underline { width: 80px; height: 3px; background: #0a4da4; margin-top: 5px; border-radius: 3px; }

        /* Action Buttons */
        .admin-action-btn { background: #1e6fdf; color: white; border: none; padding: 10px 24px; border-radius: 30px; font-family: 'Poppins', sans-serif; font-weight: 600; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; gap: 8px; }
        .admin-action-btn:hover { background: #0a4da4; }

        /* Upload Panel Box */
        .upload-card { background: white; border-radius: 20px; padding: 25px; margin-bottom: 35px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); display: none; }
        .upload-card h3 { color: #0a4da4; margin-bottom: 15px; font-size: 1.2rem; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; align-items: end; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 0.85rem; font-weight: 600; color: #5a6e8a; }
        .form-group input, .form-group select { padding: 10px 14px; border-radius: 10px; border: 1px solid #cbd5e1; font-family: 'Poppins', sans-serif; font-size: 0.9rem; }
        .upload-submit-btn { background: #0a4da4; color: white; border: none; padding: 11px 25px; border-radius: 10px; font-family: 'Poppins', sans-serif; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
        .upload-submit-btn:hover { opacity: 0.9; }

        /* Age Group Filters */
        .gallery-filters { display: flex; justify-content: center; gap: 20px; margin-bottom: 40px; margin-top: 20px; }
        .filter-btn { background: white; color: #0a4da4; border: 2px solid #0a4da4; padding: 10px 28px; border-radius: 40px; font-family: 'Poppins', sans-serif; font-weight: 600; cursor: pointer; transition: all 0.3s ease; }
        .filter-btn:hover { background: #e0eafd; }
        .filter-btn.active { background: #0a4da4; color: white; box-shadow: 0 6px 15px rgba(10, 77, 164, 0.25); }

        /* Gallery Main Grid Layout */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 35px; }
        .gallery-item { background: white; border-radius: 24px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.06); transition: transform 0.3s ease, box-shadow 0.3s ease; cursor: pointer; display: flex; flex-direction: column; }
        .gallery-item:hover { transform: translateY(-6px); box-shadow: 0 15px 35px rgba(10, 77, 164, 0.15); }

        /* Facebook Style Dynamic Composite Preview Grid System */
        .fb-grid-wrapper { width: 100%; height: 320px; background: #e2e8f0; display: grid; gap: 4px; overflow: hidden; position: relative; }
        
        /* Grid Formations based on image count class names */
        .fb-grid-wrapper.count-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
        .fb-grid-wrapper.count-2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
        .fb-grid-wrapper.count-3 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
        .fb-grid-wrapper.count-3 .fb-img-box:first-child { grid-row: span 2; }
        .fb-grid-wrapper.count-4, .fb-grid-wrapper.count-more { grid-template-columns: repeat(3, 1fr); grid-template-rows: 2fr 1fr; }
        .fb-grid-wrapper.count-4 .fb-img-box:first-child, .fb-grid-wrapper.count-more .fb-img-box:first-child { grid-column: span 3; }

        .fb-img-box { position: relative; width: 100%; height: 100%; overflow: hidden; }
        .fb-img-box img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s ease; }
        .gallery-item:hover .fb-img-box img { transform: scale(1.03); }

        /* Plus Text Counter Overlay Badge matching Facebook post structures */
        .fb-more-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(12, 27, 51, 0.7); display: flex; align-items: center; justify-content: center; color: white; font-size: 1.6rem; font-weight: 700; backdrop-filter: blur(2px); }

        .img-details { padding: 22px; border-top: 1px solid #f0f4fa; background: white; }
        .img-details h4 { font-size: 1.1rem; color: #1f2a44; margin-bottom: 6px; font-weight: 600; line-height: 1.4; }
        .img-details p { font-size: 0.85rem; color: #64748b; display: flex; align-items: center; gap: 6px; }

        /* Lightbox Carousel Modal CSS Structures */
        .lightbox { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(12, 27, 51, 0.96); backdrop-filter: blur(10px); display: none; justify-content: center; align-items: center; z-index: 10000; padding: 20px; }
        .lightbox-content { max-width: 85%; max-height: 78vh; border-radius: 16px; box-shadow: 0 25px 50px rgba(0,0,0,0.6); object-fit: contain; }
        .lightbox-close { position: absolute; top: 25px; right: 35px; color: white; font-size: 42px; cursor: pointer; z-index: 10100; transition: color 0.2s; }
        .lightbox-close:hover { color: #1e6fdf; }
        .lightbox-caption { position: absolute; bottom: 35px; color: white; font-size: 1.1rem; background: rgba(0,0,0,0.75); padding: 12px 30px; border-radius: 40px; text-align: center; font-weight: 500; min-width: 260px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }

        /* Carousel Navigation Controls */
        .nav-arrow { position: absolute; top: 50%; transform: translateY(-50%); color: white; font-size: 28px; background: rgba(255,255,255,0.08); width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; transition: all 0.2s ease; z-index: 10050; }
        .nav-arrow:hover { background: #1e6fdf; color: white; box-shadow: 0 0 15px rgba(30,111,223,0.4); }
        .left-arrow { left: 40px; }
        .right-arrow { right: 40px; }

        /* Status States */
        .status-msg { text-align: center; padding: 40px; color: #5a6e8a; font-size: 1.1rem; width: 100%; grid-column: 1 / -1; }

        /* Footer */
        .footer { background: #0c1b33; color: white; text-align: center; padding: 20px; margin-top: 60px; }
    </style>
</head>
<body>

    <div class="top-nav">
        <a href="index.html" class="logo-link">
            <div class="logo-area">
                <i class="fas fa-futbol logo-icon"></i>
                <span class="logo-text">Blue5<span class="accent">Football</span> Academy</span>
            </div>
        </a>
        <nav class="main-nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html">Log in</a></li>
                <li><a href="Payment.html">Payment</a></li>
                <li><a href="sessions.html">Sessions</a></li>
                <li><a href="photos.html" class="active-nav">Photos</a></li>
                <li><a href="Coach.html">Coach</a></li>
            </ul>
        </nav>
    </div>

    <div class="container">
        <div class="header-wrapper">
            <div>
                <h2 class="section-title"><i class="fas fa-camera"></i> Training Moments Gallery</h2>
                <div class="title-underline"></div>
            </div>
            <button class="admin-action-btn" id="openUploadBoxBtn"><i class="fas fa-cloud-upload-alt"></i> Upload Batch</button>
        </div>

        <div class="upload-card" id="uploadCard">
            <h3><i class="fas fa-plus-circle"></i> Upload Photo Batch</h3>
            <form id="photoUploadForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="photoFile">Choose Image Files (Select Multiple)</label>
                        <input type="file" id="photoFile" name="photos[]" accept="image/png, image/jpeg, image/jpg, image/webp" multiple required>
                        <small id="fileCountIndicator" style="color: #1e6fdf; font-weight: 600; margin-top: 4px; display: block; min-height: 1.2em;"></small>
                    </div>
                    <div class="form-group">
                        <label for="photoDesc">Batch Description / Title</label>
                        <input type="text" id="photoDesc" placeholder="e.g. Saturday Drills Bunch" required>
                    </div>
                    <div class="form-group">
                        <label for="photoAgeGroup">Target Age Cohort Group</label>
                        <select id="photoAgeGroup" required>
                            <option value="6-8">6-8 Years Old</option>
                            <option value="9-11">9-11 Years Old</option>
                        </select>
                    </div>
                    <button type="submit" class="upload-submit-btn" id="uploadSubmitBtn">Publish Batch to Portal</button>
                </div>
            </form>
        </div>

        <div class="gallery-filters">
            <button class="filter-btn active" data-filter="all">All Groups</button>
            <button class="filter-btn" data-filter="6-8">6-8 Years Old</button>
            <button class="filter-btn" data-filter="9-11">9-11 Years Old</button>
        </div>

        <div class="gallery-grid" id="galleryGrid">
            <div class="status-msg" id="gridStatus"><i class="fas fa-spinner fa-spin"></i> Connecting to gallery database...</div>
        </div>
    </div>

    <div id="lightboxModal" class="lightbox">
        <span class="lightbox-close" id="closeBtn">&times;</span>
        <div class="nav-arrow left-arrow" id="prevBtn"><i class="fas fa-chevron-left"></i></div>
        <img class="lightbox-content" id="lightboxImg" alt="Enlarged View">
        <div class="nav-arrow right-arrow" id="nextBtn"><i class="fas fa-chevron-right"></i></div>
        <div class="lightbox-caption" id="lightboxCaption"></div>
    </div>

    <footer class="footer">
        <div class="copyright">© 2026 Blue5 Football Academy — Media Portal</div>
    </footer>

    <script type="module">
        import { supabase } from './supabase-config.js';

        const CORRECT_PASSWORD = "Saliim007";
        let currentFilter = "all";
        let groupedAlbumsCache = [];

        // Carousel variables
        let activeAlbumImages = [];
        let activeImageIndex = 0;
        let activeAlbumTitle = "";

        // UI Target Bindings
        const openUploadBoxBtn = document.getElementById('openUploadBoxBtn');
        const uploadCard = document.getElementById('uploadCard');
        const photoUploadForm = document.getElementById('photoUploadForm');
        const fileInput = document.getElementById('photoFile');
        const fileCountIndicator = document.getElementById('fileCountIndicator');
        const galleryGrid = document.getElementById('galleryGrid');
        const gridStatus = document.getElementById('gridStatus');

        // Lightbox bindings
        const lightboxModal = document.getElementById('lightboxModal');
        const lightboxImg = document.getElementById('lightboxImg');
        const lightboxCaption = document.getElementById('lightboxCaption');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const closeBtn = document.getElementById('closeBtn');

        if (!supabase || !supabase.storage) {
            console.error("Supabase client missing or misconfigured.");
            document.getElementById('gridStatus').innerHTML = `
                <span style="color:#e53e3e; font-weight:600;">
                    <i class="fas fa-exclamation-triangle"></i> Configuration Error: Unable to bind to the client module.
                </span>`;
        }

        // Live selection updates
        fileInput.addEventListener('change', () => {
            const count = fileInput.files.length;
            if (count > 1) {
                fileCountIndicator.textContent = `Selected: ${count} images ready for batch upload.`;
            } else if (count === 1) {
                fileCountIndicator.textContent = `Selected: 1 image ready.`;
            } else {
                fileCountIndicator.textContent = ``;
            }
        });

        // Verify Admin Credentials
        openUploadBoxBtn.addEventListener('click', () => {
            if (uploadCard.style.display === 'block') {
                uploadCard.style.display = 'none';
                return;
            }
            const accessKey = prompt("Coach Access Verification Required:\nEnter Security Password:");
            if (accessKey === null) return;
            
            if (accessKey === CORRECT_PASSWORD) {
                uploadCard.style.display = 'block';
                uploadCard.scrollIntoView({ behavior: 'smooth' });
            } else {
                alert("Access Denied: Incorrect portal security key token match.");
            }
        });

        // Pull Images and Group them together dynamically
        async function fetchGalleryRecords() {
            if (!supabase) return;
            try {
                const { data, error } = await supabase
                    .from('gallery_photos')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                // Group entries matching title string + cohort assignment tag
                const groupingMap = {};
                (data || []).forEach(item => {
                    const key = item.description.trim().toLowerCase() + "_" + item.age_group;
                    if (!groupingMap[key]) {
                        groupingMap[key] = {
                            description: item.description,
                            age_group: item.age_group,
                            urls: []
                        };
                    }
                    groupingMap[key].urls.push(item.image_url);
                });

                groupedAlbumsCache = Object.values(groupingMap);
                renderActiveView();
            } catch (err) {
                console.error("Database records compilation error:", err);
                gridStatus.innerHTML = `<span style="color:#e53e3e;"><i class="fas fa-wifi"></i> Sync error reading gallery entries.</span>`;
            }
        }

        function renderActiveView() {
            const filtered = groupedAlbumsCache.filter(album => currentFilter === 'all' || album.age_group === currentFilter);
            
            if (filtered.length === 0) {
                galleryGrid.innerHTML = `<div class="status-msg"><i class="far fa-images"></i> No photo groups found in this category.</div>`;
                return;
            }

            galleryGrid.innerHTML = '';
            filtered.forEach(album => {
                const iconClass = album.age_group === '6-8' ? 'fa-child' : 'fa-user-friends';
                const card = document.createElement('div');
                card.className = 'gallery-item';
                
                const totalCount = album.urls.length;
                let gridClass = 'count-1';
                let imagesHtml = '';

                // Build a dynamic, nested layout block reminiscent of Facebook photo feeds
                if (totalCount === 1) {
                    gridClass = 'count-1';
                    imagesHtml = `<div class="fb-img-box"><img src="${album.urls[0]}" alt="Image 1"></div>`;
                } else if (totalCount === 2) {
                    gridClass = 'count-2';
                    imagesHtml = `
                        <div class="fb-img-box"><img src="${album.urls[0]}" alt="Image 1"></div>
                        <div class="fb-img-box"><img src="${album.urls[1]}" alt="Image 2"></div>
                    `;
                } else if (totalCount === 3) {
                    gridClass = 'count-3';
                    imagesHtml = `
                        <div class="fb-img-box"><img src="${album.urls[0]}" alt="Image 1"></div>
                        <div class="fb-img-box"><img src="${album.urls[1]}" alt="Image 2"></div>
                        <div class="fb-img-box"><img src="${album.urls[2]}" alt="Image 3"></div>
                    `;
                } else if (totalCount === 4) {
                    gridClass = 'count-4';
                    imagesHtml = `
                        <div class="fb-img-box"><img src="${album.urls[0]}" alt="Image 1"></div>
                        <div class="fb-img-box"><img src="${album.urls[1]}" alt="Image 2"></div>
                        <div class="fb-img-box"><img src="${album.urls[2]}" alt="Image 3"></div>
                        <div class="fb-img-box"><img src="${album.urls[3]}" alt="Image 4"></div>
                    `;
                } else {
                    gridClass = 'count-more';
                    const remaining = totalCount - 3;
                    imagesHtml = `
                        <div class="fb-img-box"><img src="${album.urls[0]}" alt="Image 1"></div>
                        <div class="fb-img-box"><img src="${album.urls[1]}" alt="Image 2"></div>
                        <div class="fb-img-box"><img src="${album.urls[2]}" alt="Image 3"></div>
                        <div class="fb-img-box">
                            <img src="${album.urls[3]}" alt="Image 4">
                            <div class="fb-more-overlay">+${remaining}</div>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="fb-grid-wrapper ${gridClass}">
                        ${imagesHtml}
                    </div>
                    <div class="img-details">
                        <h4>${escapeHtml(album.description)}</h4>
                        <p><i class="fas ${iconClass}"></i> Age Group: ${album.age_group} Years</p>
                    </div>
                `;
                
                // Clicking opens the entire bundle inside the carousel view
                card.addEventListener('click', () => initCarousel(album.urls, album.description));
                galleryGrid.appendChild(card);
            });
        }

        // Initialize carousel variables and load image indices
        function initCarousel(imageUrls, title) {
            activeAlbumImages = imageUrls;
            activeImageIndex = 0;
            activeAlbumTitle = title;
            updateCarouselState();
            
            lightboxModal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function updateCarouselState() {
            lightboxImg.src = activeAlbumImages[activeImageIndex];
            lightboxCaption.textContent = `${escapeHtml(activeAlbumTitle)} (${activeImageIndex + 1}/${activeAlbumImages.length})`;
            
            if (activeAlbumImages.length <= 1) {
                prevBtn.style.display = 'none';
                nextBtn.style.display = 'none';
            } else {
                prevBtn.style.display = 'flex';
                nextBtn.style.display = 'flex';
            }
        }

        // Carousel Arrow Navigation Rules
        prevBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            activeImageIndex = (activeImageIndex === 0) ? activeAlbumImages.length - 1 : activeImageIndex - 1;
            updateCarouselState();
        });

        nextBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            activeImageIndex = (activeImageIndex === activeAlbumImages.length - 1) ? 0 : activeImageIndex + 1;
            updateCarouselState();
        });

        closeBtn.addEventListener('click', () => {
            lightboxModal.style.display = 'none';
            document.body.style.overflow = '';
        });

        lightboxModal.addEventListener('click', (e) => {
            if (e.target === lightboxModal) {
                lightboxModal.style.display = 'none';
                document.body.style.overflow = '';
            }
        });

        // Processing Multi-File Batch Storage Upload Pipelines
        photoUploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!supabase) {
                alert("Upload Blocked: Database initialization incomplete.");
                return;
            }

            const descInput = document.getElementById('photoDesc');
            const ageGroupInput = document.getElementById('photoAgeGroup');
            const submitBtn = document.getElementById('uploadSubmitBtn');

            const selectedFiles = fileInput.files;
            if (!selectedFiles || selectedFiles.length === 0) {
                alert("Please select at least one image file.");
                return;
            }

            submitBtn.disabled = true;
            const totalFiles = selectedFiles.length;
            const rowsToInsert = [];

            try {
                // Upload files to storage bucket
                for (let i = 0; i < totalFiles; i++) {
                    const activeFile = selectedFiles[i];
                    submitBtn.textContent = `Uploading files (${i + 1}/${totalFiles})...`;

                    const fileExt = activeFile.name.split('.').pop();
                    const cleanFileName = `${Date.now()}-${Math.random().toString(36).substring(2, 7)}.${fileExt}`;
                    const pathLocation = `uploads/${cleanFileName}`;

                    const { error: storageError } = await supabase.storage
                        .from('academy-photos')
                        .upload(pathLocation, activeFile);

                    if (storageError) throw storageError;

                    const { data: urlData } = supabase.storage
                        .from('academy-photos')
                        .getPublicUrl(pathLocation);

                    rowsToInsert.push({
                        storage_path: pathLocation,
                        image_url: urlData.publicUrl,
                        description: descInput.value.trim(),
                        age_group: ageGroupInput.value
                    });
                }

                submitBtn.textContent = "Saving to database...";

                // Batch insert into table using minimal return payload to bypass RLS loops
                const { error: tableError } = await supabase
                    .from('gallery_photos')
                    .insert(rowsToInsert, { returning: 'minimal' });

                if (tableError) {
                    if (tableError.message.includes("row-level security policy")) {
                        alert(`❌ Database error: Row Level Security rules blocked this operation.\nCheck table configuration.`);
                    } else {
                        throw tableError;
                    }
                    return;
                }

                alert(`Success: Published album block featuring ${totalFiles} photos!`);
                
                photoUploadForm.reset();
                fileCountIndicator.textContent = '';
                uploadCard.style.display = 'none';
                
                await fetchGalleryRecords();

            } catch (err) {
                console.error("Fatal transaction error:", err);
                alert(`Upload failed: ${err.message}`);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Publish Batch to Portal";
            }
        });

        // Filter Controls Setup
        document.querySelectorAll('.filter-btn').forEach(button => {
            button.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                currentFilter = e.target.getAttribute('data-filter');
                renderActiveView();
            });
        });

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Initialize App View
        if (supabase) {
            fetchGalleryRecords();
        }
    </script>
</body>
</html>
