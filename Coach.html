<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue5 Academy | Coach Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #f0f4fa; }
        .top-nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; background: white; box-shadow: 0 2px 12px rgba(0,0,0,0.05); }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-icon { font-size: 28px; color: #0a4da4; }
        .logo-text { font-size: 1.3rem; font-weight: 700; color: #0a4da4; }
        .logo-text .accent { font-weight: 800; color: #1e6fdf; }
        .logo-link { text-decoration: none; }
        .main-nav ul { display: flex; gap: 28px; list-style: none; }
        .main-nav a { text-decoration: none; color: #1f2a44; font-weight: 500; }
        .main-nav a.active-nav { color: #0a4da4; font-weight: 600; }
        .container { max-width: 1300px; margin: 30px auto; padding: 20px; }
        .section-title { text-align: center; color: #0a4da4; margin-bottom: 20px; }
        .title-underline { width: 80px; height: 3px; background: #0a4da4; margin: 0 auto 30px; border-radius: 3px; }
        .coach-table-wrapper { overflow-x: auto; background: white; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 5px; }
        .payment-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        .payment-table th { background: #0a4da4; color: white; padding: 14px 10px; text-align: center; font-weight: 600; position: sticky; top: 0; }
        .payment-table td { padding: 12px 8px; text-align: center; border-bottom: 1px solid #e2e8f0; }
        .student-name-cell { font-weight: 600; background: #f8fafd; text-align: left; padding-left: 20px; white-space: nowrap; font-size: 0.85rem; color: #1f2a44; }
        .paid-cell { background-color: #d1fae5; color: #0a6e44; font-weight: 500; }
        .unpaid-cell { background-color: #fff9ef; color: #b45309; }
        .paid-icon { color: #10b981; margin-right: 5px; }
        .unpaid-icon { color: #f59e0b; margin-right: 5px; }
        .password-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; z-index: 10000; }
        .password-box { background: white; padding: 35px 30px; border-radius: 32px; text-align: center; width: 360px; max-width: 90%; box-shadow: 0 20px 35px rgba(0,0,0,0.2); }
        .password-box i { font-size: 48px; color: #0a4da4; margin-bottom: 15px; }
        .password-box h3 { margin-bottom: 20px; color: #1e2a45; }
        .password-box input { width: 100%; padding: 12px 15px; border-radius: 60px; border: 1px solid #ccc; margin-bottom: 20px; font-size: 1rem; text-align: center; }
        .password-box button { background: #0a4da4; color: white; border: none; padding: 10px 20px; border-radius: 40px; font-weight: 600; cursor: pointer; width: 100%; }
        .error-msg { color: #e53e3e; margin-top: 12px; font-size: 0.85rem; }
        .footer { background: #0c1b33; color: white; text-align: center; padding: 20px; margin-top: 50px; }
    </style>
</head>
<body>

    <div class="top-nav">
        <a href="index.html" class="logo-link">
            <div class="logo-area">
                <i class="fas fa-futbol logo-icon"></i>
                <span class="logo-text">Blue5<span class="accent">Football</span> Academy</span>
            </div>
        </a>
        <nav class="main-nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html">Log in</a></li>
                <li><a href="Payment.html">Payment</a></li>
                <li><a href="sessions.html">Sessions</a></li>
                <li><a href="Coach.html" class="active-nav">Coach</a></li>
            </ul>
        </nav>
    </div>

    <div id="coachContent" style="display: none;">
        <div class="container">
            <h2 class="section-title"><i class="fas fa-chalkboard-user"></i> Active Student Payment Overview</h2>
            <div class="title-underline"></div>
            <div class="coach-table-wrapper">
                <table class="payment-table" id="studentPaymentTable">
                    <thead id="tableHeader"></thead>
                    <tbody id="tableBody">
                        <tr><td colspan="13" style="padding: 30px; color: #5a6e8a;"><i class="fas fa-spinner fa-spin"></i> Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <footer class="footer" id="footer" style="display: none;">
        <div class="copyright">© 2026 Blue5 Football Academy — Coach Portal</div>
    </footer>

    <div id="passwordModal" class="password-modal">
        <div class="password-box">
            <i class="fas fa-lock"></i>
            <h3>Coach Access Required</h3>
            <input type="password" id="coachPassword" placeholder="Enter security password" autofocus>
            <button id="submitPasswordBtn">Unlock Portal</button>
            <div id="passwordError" class="error-msg"></div>
        </div>
    </div>

    <script type="module">
        let supabase = null;
        try {
            const module = await import('./supabase-config.js');
            supabase = module.supabase;
        } catch (err) {
            console.error("Supabase load missing:", err);
        }

        const CORRECT_PASSWORD = "Saliim007";
        const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

        const passwordInput = document.getElementById('coachPassword');
        const submitBtn = document.getElementById('submitPasswordBtn');
        const errorDiv = document.getElementById('passwordError');
        const coachContent = document.getElementById('coachContent');
        const footer = document.getElementById('footer');
        const modal = document.getElementById('passwordModal');

        document.body.style.overflow = 'hidden';

        async function loadAndRenderLivePayments() {
            const thead = document.getElementById('tableHeader');
            const tbody = document.getElementById('tableBody');
            
            try {
                // Fetch user payments alongside the student_name column
                const { data: allPayments, error: paymentError } = await supabase
                    .from('user_payments')
                    .select('user_id, student_name, month, paid');

                if (paymentError) throw paymentError;

                let headerHtml = '<tr><th>Student Name</th>';
                months.forEach(month => { headerHtml += `<th>${month.substring(0,3)}</th>`; });
                headerHtml += '</tr>';
                thead.innerHTML = headerHtml;

                if (!allPayments || allPayments.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="13" style="padding:30px; color:#b45309;"><i class="fas fa-exclamation-triangle"></i> The table is empty.</td></tr>`;
                    return;
                }

                // Group by User ID map
                const uniqueUsers = {};
                allPayments.forEach(p => {
                    if (!uniqueUsers[p.user_id]) {
                        // Use saved name string, or fall back cleanly if legacy row
                        uniqueUsers[p.user_id] = p.student_name || `User (...${p.user_id.substring(0,6)})`;
                    }
                });

                let bodyHtml = '';
                Object.keys(uniqueUsers).forEach(userId => {
                    const studentDisplayLabel = uniqueUsers[userId];
                    bodyHtml += `<tr><td class="student-name-cell"><i class="fas fa-user-circle"></i> ${studentDisplayLabel}</td>`;
                    
                    months.forEach(month => {
                        const matchRecord = allPayments.find(p => 
                            p.user_id === userId && 
                            p.month.toLowerCase() === month.toLowerCase()
                        );
                        
                        const isPaid = matchRecord ? matchRecord.paid : false;
                        const cellClass = isPaid ? 'paid-cell' : 'unpaid-cell';
                        const icon = isPaid ? '<i class="fas fa-check-circle paid-icon"></i>' : '<i class="fas fa-times-circle unpaid-icon"></i>';
                        const statusLabel = isPaid ? 'Paid' : 'Pending';

                        bodyHtml += `<td class="${cellClass}">${icon} ${statusLabel}</td>`;
                    });
                    bodyHtml += '</tr>';
                });
                tbody.innerHTML = bodyHtml;

            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="13" style="color:red; padding:20px;">Error: ${error.message}</td></tr>`;
            }
        }

        function checkPassword() {
            if (passwordInput.value.trim() === CORRECT_PASSWORD) {
                document.body.style.overflow = '';
                if (modal) modal.remove();
                coachContent.style.display = 'block';
                footer.style.display = 'block';
                loadAndRenderLivePayments();
            } else {
                errorDiv.textContent = 'Incorrect password.';
            }
        }

        submitBtn.addEventListener('click', checkPassword);
        passwordInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') checkPassword(); });
    </script>
</body>
</html>
