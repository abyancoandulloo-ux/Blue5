<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue5 Academy | Coach Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #f0f4fa; color: #1f2a44; }
        
        /* Navbar navigation links */
        .top-nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; background: white; box-shadow: 0 2px 12px rgba(0,0,0,0.05); }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-icon { font-size: 28px; color: #0a4da4; }
        .logo-text { font-size: 1.3rem; font-weight: 700; color: #0a4da4; }
        .logo-text .accent { font-weight: 800; color: #1e6fdf; }
        .logo-link { text-decoration: none; }
        .main-nav ul { display: flex; gap: 28px; list-style: none; }
        .main-nav a { text-decoration: none; color: #1f2a44; font-weight: 500; }
        .main-nav a.active-nav { color: #0a4da4; font-weight: 600; }
        .mobile-menu-icon { display: none; cursor: pointer; font-size: 24px; color: #0a4da4; }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .dashboard-title { font-size: 1.5rem; font-weight: 700; color: #0a4da4; }
        
        .reset-btn { background: #e53e3e; color: white; border: none; padding: 10px 20px; border-radius: 50px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 0.9rem; transition: background 0.2s; }
        .reset-btn:hover { background: #c53030; }

        .data-card { background: white; padding: 30px; border-radius: 28px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .table-responsive { overflow-x: auto; margin-top: 15px; }
        
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { padding: 14px; background: #f8fafc; color: #64748b; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid #e2e8f0; }
        td { padding: 14px; border-bottom: 1px solid #e2e8f0; font-size: 0.9rem; color: #1f2a44; vertical-align: middle; }
        tr:hover td { background: #f8fafc; }

        .student-info { display: flex; align-items: center; gap: 12px; }
        .student-avatar { width: 35px; height: 35px; border-radius: 50%; background: #e2e8f0; display: flex; align-items: center; justify-content: center; color: #64748b; font-size: 0.9rem; object-fit: cover; }
        .student-name { font-weight: 600; }
        .student-id { font-family: monospace; font-size: 0.75rem; color: #64748b; }

        /* Custom Checkbox Styling */
        .checkbox-container { display: block; position: relative; padding-left: 25px; cursor: pointer; font-size: 14px; user-select: none; }
        .checkbox-container input { position: absolute; opacity: 0; cursor: pointer; height: 0; width: 0; }
        .checkmark { position: absolute; top: 0; left: 0; height: 18px; width: 18px; background-color: #cbd5e1; border-radius: 4px; transition: all 0.2s; }
        .checkbox-container:hover input ~ .checkmark { background-color: #94a3b8; }
        .checkbox-container input:checked ~ .checkmark { background-color: #10b981; }
        .checkmark:after { content: ""; position: absolute; display: none; }
        .checkbox-container input:checked ~ .checkmark:after { display: block; }
        .checkbox-container .checkmark:after { left: 6px; top: 2.5px; width: 4px; height: 8px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg); }

        .loading-overlay { text-align: center; padding: 60px 0; color: #0a4da4; }
        .loading-overlay i { font-size: 2.5rem; margin-bottom: 10px; }
        
        .footer { background: #0c1b33; color: white; text-align: center; padding: 20px; margin-top: 60px; }

        @media (max-width: 850px) {
            .top-nav { padding: 15px 20px; }
            .main-nav ul { display: none; flex-direction: column; position: absolute; top: 65px; left: 0; width: 100%; background: white; padding: 20px; z-index: 100; gap: 15px; }
            .main-nav ul.show-mobile { display: flex; }
            .mobile-menu-icon { display: block; }
            .dashboard-header { flex-direction: column; align-items: flex-start; gap: 15px; }
            .reset-btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <a href="index.html" class="logo-link">
            <div class="logo-area">
                <i class="fas fa-futbol logo-icon"></i>
                <span class="logo-text">Blue5<span class="accent">Football</span> Academy</span>
            </div>
        </a>
        <nav class="main-nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html">Log in</a></li>
                <li><a href="sessions.html">Sessions</a></li>
                <li><a href="Coach.html" class="active-nav">Coach</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="players.html">Players</a></li>
            </ul>
        </nav>
        <div class="mobile-menu-icon" onclick="toggleMobileMenu()"><i class="fas fa-bars"></i></div>
    </div>

    <div class="container">
        <div class="dashboard-header">
            <div class="dashboard-title"><i class="fas fa-chalkboard-teacher"></i> Attendance & Payment Management</div>
            <button class="reset-btn" id="resetBtn" onclick="resetAllPayments()"><i class="fas fa-trash-alt"></i> Reset All Payment Logs</button>
        </div>

        <div class="data-card">
            <div id="loadingView" class="loading-overlay">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Loading roster management matrices...</p>
            </div>

            <div class="table-responsive" id="tableView" style="display: none;">
                <table>
                    <thead>
                        <tr>
                            <th>Athlete Registry</th>
                            <th>Jan</th>
                            <th>Feb</th>
                            <th>Mar</th>
                            <th>Apr</th>
                            <th>May</th>
                            <th>Jun</th>
                            <th>Jul</th>
                            <th>Aug</th>
                            <th>Sep</th>
                            <th>Oct</th>
                            <th>Nov</th>
                            <th>Dec</th>
                        </tr>
                    </thead>
                    <tbody id="rosterTableBody">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <footer class="footer"><div class="copyright">© 2026 Blue5 Football Academy</div></footer>

    <script type="module">
        import { supabase } from './supabase-config.js';

        const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        let studentsList = [];
        let paymentsList = [];

        async function loadDashboardData() {
            try {
                document.getElementById('loadingView').style.display = 'block';
                document.getElementById('tableView').style.display = 'none';

                // Fetch student metadata rows alongside logged payment history configurations
                const [usersResult, paymentsResult] = await Promise.all([
                    supabase.from('users').select('id, name, email, avatar_url'),
                    supabase.from('user_payments').select('*')
                ]);

                if (usersResult.error) throw usersResult.error;
                if (paymentsResult.error) throw paymentsResult.error;

                studentsList = usersResult.data || [];
                paymentsList = paymentsResult.data || [];

                renderDashboardTable();
            } catch (err) {
                console.error("Dashboard processing crash analytics logs:", err);
                alert("Failed to sync database information tables.");
            }
        }

        function renderDashboardTable() {
            const tableBody = document.getElementById('rosterTableBody');
            
            if (studentsList.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="13" style="text-align: center; padding: 30px; color: #64748b;">No athlete profiles registered in system tables.</td></tr>`;
                document.getElementById('loadingView').style.display = 'none';
                document.getElementById('tableView').style.display = 'block';
                return;
            }

            // Map payment data structural elements for easy matrix lookup tracking
            const lookupMap = {};
            paymentsList.forEach(p => {
                if (!lookupMap[p.user_id]) lookupMap[p.user_id] = {};
                if (p.month) lookupMap[p.user_id][p.month.toLowerCase()] = p.paid;
            });

            let rowsHtml = '';
            studentsList.forEach(student => {
                let monthCells = '';
                
                months.forEach(m => {
                    const monthKey = m.toLowerCase();
                    const isPaid = (lookupMap[student.id] && lookupMap[student.id][monthKey]) || false;
                    
                    monthCells += `
                        <td>
                            <label class="checkbox-container">
                                <input type="checkbox" 
                                       data-user-id="${student.id}" 
                                       data-month="${m}" 
                                       ${isPaid ? 'checked' : ''} 
                                       class="payment-toggle-node">
                                <span class="checkmark"></span>
                            </label>
                        </td>`;
                });

                rowsHtml += `
                    <tr>
                        <td>
                            <div class="student-info">
                                ${student.avatar_url ? 
                                    `<img src="${student.avatar_url}" class="student-avatar" alt="">` : 
                                    `<div class="student-avatar"><i class="fas fa-user"></i></div>`
                                }
                                <div>
                                    <div class="student-name">${student.name || 'Anonymous Athlete'}</div>
                                    <div class="student-id">${student.id.substring(0,8)}...</div>
                                </div>
                            </div>
                        </td>
                        ${monthCells}
                    </tr>`;
            });

            tableBody.innerHTML = rowsHtml;
            document.getElementById('loadingView').style.display = 'none';
            document.getElementById('tableView').style.display = 'block';

            // Attach explicit operational handles to newly injected node entities
            document.querySelectorAll('.payment-toggle-node').forEach(checkbox => {
                checkbox.addEventListener('change', handleToggleCheckboxTransaction);
            });
        }

        async function handleToggleCheckboxTransaction(e) {
            const checkbox = e.target;
            const userId = checkbox.getAttribute('data-user-id');
            const targetMonth = checkbox.getAttribute('data-month');
            const stateIsChecked = checkbox.checked;

            checkbox.disabled = true;

            try {
                if (stateIsChecked) {
                    // Create entry parameter line on checked modification bounds
                    const { error } = await supabase
                        .from('user_payments')
                        .upsert({ user_id: userId, month: targetMonth, paid: true }, { onConflict: 'user_id,month' });
                    
                    if (error) throw error;
                } else {
                    // Drop entity matching contextual selection matrices parameters
                    const { error } = await supabase
                        .from('user_payments')
                        .delete()
                        .eq('user_id', userId)
                        .eq('month', targetMonth);
                    
                    if (error) throw error;
                }
            } catch (err) {
                console.error("Single switch logging transaction fault:", err);
                checkbox.checked = !stateIsChecked; // Revert visually on transaction failure bounds
                alert("Failed to modify record structure.");
            } finally {
                checkbox.disabled = false;
            }
        }

        window.resetAllPayments = async () => {
            if (!confirm("Are you absolute certain you want to permanently clear out all historical payment and attendance entries? This action cannot be reversed.")) return;

            const resetBtn = document.getElementById('resetBtn');
            resetBtn.disabled = true;
            resetBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Resetting Records...`;

            try {
                // FIXED: Appended condition parameter logic targeting all records safely to bypass implicit engine safeguards
                const { error } = await supabase
                    .from('user_payments')
                    .delete()
                    .neq('user_id', ''); 

                if (error) throw error;

                alert("Database matrix successfully wiped cleanly!");
                
                // Clear state structures parameters arrays locally and re-render visual tables UI
                paymentsList = [];
                renderDashboardTable();
            } catch (err) {
                alert("Database operations exception occurred: " + err.message);
                console.error("Mass reset crash breakdown logs:", err);
            } finally {
                resetBtn.disabled = false;
                resetBtn.innerHTML = `<i class="fas fa-trash-alt"></i> Reset All Payment Logs`;
            }
        };

        window.toggleMobileMenu = () => {
            document.querySelector('.main-nav ul')?.classList.toggle('show-mobile');
        };

        // Complete base initialization loading routine sequence loops
        document.addEventListener('DOMContentLoaded', loadDashboardData);
    </script>
</body>
</html>
