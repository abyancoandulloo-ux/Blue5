<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue5 Academy | Coach Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: #f0f4fa;
        }
        /* Navbar */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background: white;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-icon {
            font-size: 28px;
            color: #0a4da4;
        }
        .logo-text {
            font-size: 1.3rem;
            font-weight: 700;
            color: #0a4da4;
        }
        .logo-text .accent {
            font-weight: 800;
            color: #1e6fdf;
        }
        .logo-link {
            text-decoration: none;
        }
        .main-nav ul {
            display: flex;
            gap: 28px;
            list-style: none;
        }
        .main-nav a {
            text-decoration: none;
            color: #1f2a44;
            font-weight: 500;
        }
        .main-nav a.active-nav {
            color: #0a4da4;
            font-weight: 600;
        }
        .mobile-menu-icon {
            display: none;
            font-size: 24px;
            cursor: pointer;
        }
        /* Main Content */
        .container {
            max-width: 1300px;
            margin: 30px auto;
            padding: 20px;
        }
        .section-title {
            text-align: center;
            color: #0a4da4;
            margin-bottom: 20px;
        }
        .title-underline {
            width: 80px;
            height: 3px;
            background: #0a4da4;
            margin: 0 auto 30px;
            border-radius: 3px;
        }
        /* Table Styles */
        .coach-table-wrapper {
            overflow-x: auto;
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            padding: 5px;
        }
        .payment-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        .payment-table th {
            background: #0a4da4;
            color: white;
            padding: 14px 10px;
            text-align: center;
            font-weight: 600;
            position: sticky;
            top: 0;
        }
        .payment-table td {
            padding: 12px 8px;
            text-align: center;
            border-bottom: 1px solid #e2e8f0;
        }
        .payment-table tr:first-child th:first-child {
            border-top-left-radius: 20px;
        }
        .payment-table tr:first-child th:last-child {
            border-top-right-radius: 20px;
        }
        .student-name-cell {
            font-weight: 600;
            background: #f8fafd;
            text-align: left;
            padding-left: 20px;
        }
        .paid-cell {
            background-color: #d1fae5;
            color: #0a6e44;
            font-weight: 500;
        }
        .unpaid-cell {
            background-color: #fff9ef;
            color: #b45309;
        }
        .paid-icon {
            color: #10b981;
            margin-right: 5px;
        }
        .unpaid-icon {
            color: #f59e0b;
            margin-right: 5px;
        }
        /* Password Modal */
        .password-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }
        .password-box {
            background: white;
            padding: 35px 30px;
            border-radius: 32px;
            text-align: center;
            width: 360px;
            max-width: 90%;
            box-shadow: 0 20px 35px rgba(0,0,0,0.2);
        }
        .password-box i {
            font-size: 48px;
            color: #0a4da4;
            margin-bottom: 15px;
        }
        .password-box h3 {
            margin-bottom: 20px;
            color: #1e2a45;
        }
        .password-box input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 60px;
            border: 1px solid #ccc;
            margin-bottom: 20px;
            font-size: 1rem;
        }
        .password-box button {
            background: #0a4da4;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
        .error-msg {
            color: #e53e3e;
            margin-top: 12px;
            font-size: 0.85rem;
        }
        .footer {
            background: #0c1b33;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 50px;
        }
        @media (max-width: 768px) {
            .top-nav { padding: 12px 20px; }
            .main-nav ul { gap: 15px; }
            .payment-table th, .payment-table td { padding: 8px 4px; font-size: 0.75rem; }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <div class="top-nav">
        <a href="Home.html" class="logo-link">
            <div class="logo-area">
                <i class="fas fa-futbol logo-icon"></i>
                <span class="logo-text">Blue5<span class="accent">Football</span> Academy</span>
            </div>
        </a>
        <nav class="main-nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html">Log in</a></li>
                <li><a href="Payment.html">Payment</a></li>
                <li><a href="sessions.html">Sessions</a></li>
                <li><a href="Coach.html" class="active-nav">Coach</a></li>
            </ul>
        </nav>
        <div class="mobile-menu-icon" onclick="alert('Mobile menu')"><i class="fas fa-bars"></i></div>
    </div>

    <!-- Main Content (hidden until password success) -->
    <div id="coachContent" style="display: none;">
        <div class="container">
            <h2 class="section-title"><i class="fas fa-chalkboard-user"></i> Student Payment Overview</h2>
            <div class="title-underline"></div>
            <div class="coach-table-wrapper">
                <table class="payment-table" id="studentPaymentTable">
                    <thead id="tableHeader">
                        <!-- Header will be dynamically generated -->
                    </thead>
                    <tbody id="tableBody">
                        <!-- Student rows will be injected -->
                    </tbody>
                </table>
            </div>
            <p style="text-align: center; margin-top: 25px; color: #5a6e8a;"><i class="fas fa-info-circle"></i> Green = Paid, Orange = Pending. Updates are saved automatically.</p>
        </div>
    </div>

    <footer class="footer" id="footer" style="display: none;">
        <div class="copyright">© 2025 Blue5 Football Academy — Coach Portal</div>
    </footer>

    <!-- Password Modal -->
    <div id="passwordModal" class="password-modal">
        <div class="password-box">
            <i class="fas fa-lock"></i>
            <h3>Coach Access Required</h3>
            <input type="password" id="coachPassword" placeholder="Enter password" autofocus>
            <button id="submitPasswordBtn">Unlock Portal</button>
            <div id="passwordError" class="error-msg"></div>
        </div>
    </div>

    <script>
        (function() {
            // Correct password
            const CORRECT_PASSWORD = "Saliim007";
            
            // ---------- STUDENT DATA & PAYMENT STATUS ----------
            // List of students
            const students = [
                "Liam O'Connor", "Ethan Williams", "Mason Brown", "Noah Jones", 
                "Oliver Davis", "James Miller", "Benjamin Wilson", "Lucas Moore", 
                "Henry Taylor", "Alexander Anderson"
            ];
            
            const months = ["January", "February", "March", "April", "May", "June", 
                            "July", "August", "September", "October", "November", "December"];
            
            // Load or initialize payment data: studentPayment[student][month] = true/false
            let studentPayments = {};
            
            function loadPaymentData() {
                const stored = localStorage.getItem('blue5_coach_payments');
                if (stored) {
                    studentPayments = JSON.parse(stored);
                } else {
                    // Initialize: randomly set some months as paid for demo
                    students.forEach(student => {
                        studentPayments[student] = {};
                        months.forEach(month => {
                            // Randomly assign paid status (60% paid for demo)
                            studentPayments[student][month] = Math.random() > 0.4;
                        });
                    });
                    // Ensure some specific months are paid for realism (first student fully paid)
                    students.forEach(s => {
                        months.forEach(m => {
                            if (s === students[0]) studentPayments[s][m] = true;
                        });
                    });
                    savePaymentData();
                }
            }
            
            function savePaymentData() {
                localStorage.setItem('blue5_coach_payments', JSON.stringify(studentPayments));
            }
            
            // Render the table
            function renderTable() {
                const thead = document.getElementById('tableHeader');
                const tbody = document.getElementById('tableBody');
                if (!thead || !tbody) return;
                
                // Build header row
                let headerHtml = '<tr><th>Student / Month</th>';
                months.forEach(month => {
                    headerHtml += `<th>${month.substring(0,3)}</th>`;
                });
                headerHtml += '</tr>';
                thead.innerHTML = headerHtml;
                
                // Build body rows
                let bodyHtml = '';
                students.forEach(student => {
                    bodyHtml += `<tr>
                        <td class="student-name-cell"><i class="fas fa-user-graduate"></i> ${student}</td>`;
                    months.forEach(month => {
                        const isPaid = studentPayments[student]?.[month] || false;
                        const cellClass = isPaid ? 'paid-cell' : 'unpaid-cell';
                        const icon = isPaid ? '<i class="fas fa-check-circle paid-icon"></i>' : '<i class="fas fa-times-circle unpaid-icon"></i>';
                        bodyHtml += `<td class="${cellClass}">${icon} ${isPaid ? 'Paid' : 'Pending'}</td>`;
                    });
                    bodyHtml += '</tr>';
                });
                tbody.innerHTML = bodyHtml;
            }
            
            // Function to toggle payment for a specific student-month (optional for future admin, but not required now)
            // We keep it as demo data only, coach can view.
            
            // Initialize data and show content after password
            function unlockPortal() {
                loadPaymentData();
                renderTable();
                document.getElementById('coachContent').style.display = 'block';
                document.getElementById('footer').style.display = 'block';
                // Remove password modal
                const modal = document.getElementById('passwordModal');
                if (modal) modal.remove();
            }
            
            // Password validation
            const passwordInput = document.getElementById('coachPassword');
            const submitBtn = document.getElementById('submitPasswordBtn');
            const errorDiv = document.getElementById('passwordError');
            
            function checkPassword() {
                const entered = passwordInput.value.trim();
                if (entered === CORRECT_PASSWORD) {
                    unlockPortal();
                } else {
                    errorDiv.textContent = 'Incorrect password. Access denied.';
                    passwordInput.value = '';
                    passwordInput.focus();
                }
            }
            
            submitBtn.addEventListener('click', checkPassword);
            passwordInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') checkPassword();
            });
            
            // Prevent background scroll while modal is active
            document.body.style.overflow = 'hidden';
            // When unlocking, restore scroll
            const originalOverflow = document.body.style.overflow;
            function restoreScroll() {
                document.body.style.overflow = '';
            }
            // Override unlockPortal to restore scroll
            const originalUnlock = unlockPortal;
            window.unlockPortal = function() {
                originalUnlock();
                restoreScroll();
            };
            unlockPortal = window.unlockPortal;
            // But we need to replace reference
            window.checkPassword = checkPassword;
        })();
    </script>
</body>
</html>
