<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue5 Academy | My Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #f0f4fa; color: #1f2a44; }
        
        /* Navbar navigation links row styling matrix components */
        .top-nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; background: white; box-shadow: 0 2px 12px rgba(0,0,0,0.05); }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-icon { font-size: 28px; color: #0a4da4; }
        .logo-text { font-size: 1.3rem; font-weight: 700; color: #0a4da4; }
        .logo-text .accent { font-weight: 800; color: #1e6fdf; }
        .logo-link { text-decoration: none; }
        .main-nav ul { display: flex; gap: 28px; list-style: none; }
        .main-nav a { text-decoration: none; color: #1f2a44; font-weight: 500; }
        .main-nav a.active-nav { color: #0a4da4; font-weight: 600; }
        .mobile-menu-icon { display: none; cursor: pointer; font-size: 24px; color: #0a4da4; }

        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        .loading-overlay { text-align: center; padding: 100px 0; color: #0a4da4; }
        .loading-overlay i { font-size: 3rem; margin-bottom: 15px; }

        .profile-grid { display: flex; gap: 35px; align-items: start; display: none; }
        .profile-sidebar { flex: 1; display: flex; flex-direction: column; align-items: center; background: white; padding: 30px; border-radius: 28px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        
        /* Premium Gold FUT Custom Card Layout */
        .fifa-card { width: 240px; height: 350px; background: linear-gradient(135deg, #ffe066 0%, #f5af19 50%, #e65c00 100%); border-radius: 18px; position: relative; padding: 18px; color: #1a1a1a; box-shadow: 0 15px 35px rgba(230, 92, 0, 0.3); border: 3px solid #fff2a3; display: flex; flex-direction: column; overflow: hidden; margin-bottom: 20px; }
        .fifa-card::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: linear-gradient(45deg, transparent, rgba(255,255,255,0.2), transparent); transform: rotate(45deg); pointer-events: none; }
        .card-top-row { display: flex; align-items: center; height: 110px; margin-bottom: 5px; }
        .card-metrics-badge { display: flex; flex-direction: column; align-items: center; width: 35%; line-height: 1.1; text-align: center; border-right: 1px solid rgba(0,0,0,0.1); }
        .card-ovr-value { font-size: 2.5rem; font-weight: 800; color: #000; letter-spacing: -1px; }
        .card-pos-label { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: #222; }
        .card-crest-logo { font-size: 1.4rem; margin-top: 5px; color: #0a4da4; }
        
        .card-avatar-photo { width: 65%; height: 100%; display: flex; align-items: flex-end; justify-content: center; font-size: 5rem; color: rgba(0,0,0,0.15); position: relative; overflow: hidden; }
        .card-avatar-photo i { position: absolute; bottom: -5px; }
        .card-avatar-photo img { width: 100%; height: 100%; object-fit: cover; display: none; }

        .card-player-name { text-align: center; font-size: 1.1rem; font-weight: 700; text-transform: uppercase; padding: 4px 0; border-top: 1px solid rgba(0,0,0,0.15); border-bottom: 1px solid rgba(0,0,0,0.15); margin-bottom: 10px; color: #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-stats-grid { display: flex; width: 100%; justify-content: space-between; padding: 0 5px; }
        .card-stats-col { width: 48%; display: flex; flex-direction: column; gap: 4px; }
        .card-stat-line { display: flex; align-items: center; justify-content: space-between; font-size: 0.85rem; font-weight: 700; }
        .card-stat-val { font-size: 1rem; font-weight: 800; color: #000; margin-right: 4px; width: 22px; text-align: right; }
        .card-stat-lbl { color: #333; font-weight: 500; text-transform: uppercase; font-size: 0.75rem; }

        .star-display { font-size: 22px; color: #cbd5e1; margin-bottom: 5px; }
        .star-display i.active { color: #fbbf24; }
        .star-lbl { font-size: 0.75rem; font-weight: 600; color: #64748b; text-transform: uppercase; }

        .profile-main-content { flex: 1.8; display: flex; flex-direction: column; gap: 25px; }
        .data-card { background: white; padding: 30px; border-radius: 28px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .card-title { font-size: 1.1rem; font-weight: 700; color: #0a4da4; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; border-bottom: 2px solid #f0f4fa; padding-bottom: 10px; }
        
        .info-row { display: flex; padding: 12px 0; border-bottom: 1px dashed #e2e8f0; }
        .info-row:last-child { border-bottom: none; }
        .info-label { width: 120px; font-weight: 600; color: #64748b; font-size: 0.85rem; text-transform: uppercase; }
        .info-value { flex: 1; font-weight: 500; color: #1f2a44; font-size: 0.95rem; }

        .payments-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
        .month-badge { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 14px; padding: 12px; text-align: center; }
        .month-name { font-size: 0.8rem; font-weight: 600; color: #475569; text-transform: uppercase; margin-bottom: 5px; }
        .status-pill { font-size: 0.75rem; font-weight: 700; padding: 4px 8px; border-radius: 8px; display: inline-block; }
        .status-paid { background: #d1fae5; color: #0a6e44; }
        .status-pending { background: #fff9ef; color: #b45309; }

        .logout-btn { background: #e53e3e; color: white; border: none; padding: 12px 25px; border-radius: 50px; font-weight: 600; cursor: pointer; margin-top: 15px; width: 100%; text-align: center; display: block; text-decoration: none; }
        .footer { background: #0c1b33; color: white; text-align: center; padding: 20px; margin-top: 60px; }

        @media (max-width: 850px) {
            .profile-grid { flex-direction: column; }
            .profile-sidebar, .profile-main-content { width: 100%; flex: none; }
            .top-nav { padding: 15px 20px; }
            .main-nav ul { display: none; flex-direction: column; position: absolute; top: 65px; left: 0; width: 100%; background: white; padding: 20px; z-index: 100; gap: 15px; }
            .main-nav ul.show-mobile { display: flex; }
            .mobile-menu-icon { display: block; }
        }
    </style>
</head>
